# FTalentHub Web — cấu hình nginx BẢN PRODUCTION (có TLS).
#
# Dùng khi TLS kết thúc ở chính nginx này. Nếu TLS đã kết thúc ở reverse proxy
# phía trước (Cloudflare / ALB / Traefik...) thì KHÔNG cần file này — cứ dùng
# nginx.conf (bản dev) sau proxy, xem docs/DEPLOY.md để chọn đúng mô hình.
#
# Cách dùng (không sửa Dockerfile — mount đè lúc chạy):
#   docker run -d -p 80:80 -p 443:443 \
#     -v $PWD/frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro \
#     -v /etc/letsencrypt:/etc/nginx/tls:ro \
#     fth-web
# Chứng thư bên dưới trỏ tới đường dẫn chuẩn của certbot; đổi lại nếu bạn để
# cert ở chỗ khác. KHÔNG commit key (.gitignore đã chặn *.pem — kiểm tra lại
# trước khi git add).
server {
    listen 80;
    server_name _;
    # Mọi request HTTP trần chuyển hết sang HTTPS (giữ nguyên path + query).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Session cache + OCSP stapling cơ bản (certbot cấu hình thêm nếu cần).
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Giới hạn kích thước body: có endpoint import CSV (/school/import/students).
    client_max_body_size 5m;

    # Security header đầy đủ cho production (bản dev ở nginx.conf không có HSTS).
    # HSTS chỉ bật ở đây vì trình duyệt chỉ tôn trọng nó trên HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Đăng nhập: giới hạn riêng 5 req/phút/IP + burst 5 (vượt → 429).
    # Giống hệt bản dev — giữ nguyên để hai bản không lệch hành vi.
    # Đây vẫn chỉ là LỚP THỨ HAI sau chặn 5 lần sai/10 phút trong ứng dụng
    # (backend/app/security.py); KHÔNG áp limit_req lên /api/ chung.
    location = /api/v1/auth/login {
        limit_req zone=fth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # API: giữ nguyên path, thêm header chuyển tiếp (X-Forwarded-Proto để
    # backend biết request gốc là HTTPS khi cần dựng URL tuyệt đối).
    location /api/ {
        proxy_pass http://fth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA fallback: route /student, /coach... đều trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Vùng đếm cho endpoint đăng nhập (đặt ở ngữ cảnh http — file này được include
# từ conf.d nên nằm trong http; đừng chuyển vào trong block server).
limit_req_zone $binary_remote_addr zone=fth_login:10m rate=5r/m;

upstream fth_api {
    server api:8001;
}
