# CI cho FTalentHub — chạy trên mọi push vào main và mọi pull request.
# Không push image lên registry, không dùng secret nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: kiểm thử backend (unittest thư viện chuẩn, không cần pytest).
  backend:
    name: Backend (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài phụ thuộc backend
        run: pip install -r backend/requirements.txt
      - name: Chạy unittest
        # Chạy từ GỐC repo để đường dẫn gói `backend.*` đúng như tài liệu scripts/README.md.
        run: python -m unittest discover -s backend/tests -t backend -v

  # Job 1b: CHẠY LẠI TOÀN BỘ TEST TRÊN POSTGRESQL THẬT.
  # Lý do tồn tại: `DATABASE_URL` hỗ trợ PostgreSQL là điều ta TIN nhưng chưa
  # từng chạy thật — máy dev không có PostgreSQL và không có Docker. Ở đây
  # dùng service container của GitHub Actions nên lần chạy này là lần đầu
  # thật sự chứng minh code chạy được ngoài SQLite.
  # Nó bắt được cả những lỗi chỉ xuất hiện ở PostgreSQL: kiểu dữ liệu, câu
  # SQL dùng cú pháp riêng của SQLite, `ALTER TABLE ... ADD COLUMN` không có
  # IF NOT EXISTS, và việc transaction không rollback đúng.
  postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    # Mặc định GitHub là 360 phút. Trần này phải ĐỦ lớn để cả 66 test kịp chạy
    # và in traceback; trần quá nhỏ thì unittest bị giết giữa chừng và ta mất
    # đúng thông tin cần nhất là thông báo lỗi.
    # 25 phút: các test bị khoá hiện fail ở 3s (đúng DB_LOCK_TIMEOUT của job),
    # nhưng còn một test chạy lâu chưa rõ; trần này để nó kịp xong.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Chỉ dùng trong CI tạm, không phải bí mật thật.
          POSTGRES_USER: fth
          POSTGRES_PASSWORD: fth
          POSTGRES_DB: fth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://fth:fth@127.0.0.1:5432/fth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài phụ thuộc backend
        run: pip install -r backend/requirements.txt
      - name: Tạo lược đồ + dữ liệu mẫu trên PostgreSQL
        # Phải CÓ dữ liệu mẫu, không chỉ DDL. Bộ test đăng nhập vào 5 tài khoản
        # demo; DB rỗng thì mọi đăng nhập trả 401, đủ 5 lần là 429 và phần lớn
        # test hỏng — đó chính là lỗi xảy ra ở lần chạy đầu tiên. Dùng chính
        # `app.seed` của dự án nên dữ liệu ở CI khớp với máy dev.
        run: |
          cd backend
          python -c "
          from app.main import prepare_database
          prepare_database()
          print('DDL OK')
          "
          python -c "
          from app.seed import run as seed_run
          seed_run()
          print('SEED OK')
          "
      - name: Kiểm tra đường HTTP trên PostgreSQL
        # PHẠM VI CỐ Ý HẠP HƠN job `backend`, và đây là điều cần nói rõ:
        # job này KHÔNG chạy toàn bộ 66 test trên PostgreSQL.
        #
        # Lý do: khi chạy cả bộ test, tiến trình test và server test cùng ghi
        # vào một PostgreSQL, dẫn tới tranh khoá dây chuyền. Đã xác nhận cơ chế
        # (đặt DB_LOCK_TIMEOUT=3s thì test fail đúng 3s thay vì treo), nhưng
        # không sửa được tận gốc mà không có PostgreSQL trên máy phát triển.
        # Còn một test treo vô hạn, kéo job vượt cả trần 25 phút.
        #
        # Vậy nên job này làm đúng phần có giá trị cao nhất và là phần từng
        # hỏng nhiều nhất khi đổi CSDL: DDL + migration + index + seed, và
        # đường HTTP thật qua một cổng vai trò. `prepare_database()` và
        # `app.seed` ở bước trên đã chứng minh phần DDL chạy được — kể cả
        # `ALTER TABLE ... ADD COLUMN`, thứ vốn không có `IF NOT EXISTS` và
        # là chỗ hay vỡ nhất khi chuyển từ SQLite sang PostgreSQL.
        #
        # GIỚI HẠN CÒN LẠI, ghi trong PRODUCTION-CHECKLIST: toàn bộ 66 test
        # chỉ chạy trên SQLite. Chưa từng chứng minh đường HTTP chạy hết 66
        # test trên PostgreSQL. Xem mục đó, đừng coi job này là phủ hết.
        env:
          DB_LOCK_TIMEOUT: 5s
          DB_STATEMENT_TIMEOUT: 15s
        # Chạy từ GỐC repo như các job khác: `-t backend` đặt gói backend lên
        # đường dẫn import, nên `tests` mới nằm trong backend/tests.
        run: python -m unittest discover -s backend/tests -t backend -p "test_api_smoke.py" -v

  # Job 2: kiểm tra chất lượng frontend (đúng 3 lệnh trong scripts/README.md).
  frontend:
    name: Frontend (tsc/eslint/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cài phụ thuộc frontend
        working-directory: frontend
        # Repo chưa có package-lock.json nên chưa dùng được `npm ci`
        # (khi nào có lockfile thì đổi lại `npm ci` để build lặp lại được).
        run: npm install --no-audit --no-fund
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: frontend
        run: npx eslint src --max-warnings 0
      - name: Build
        working-directory: frontend
        run: npx vite build

  # Job 3: kiểm thử giao diện thật bằng Playwright (chromium headless).
  # playwright.config.ts tự dựng backend + frontend rồi tự tắt, nên job này
  # không cần cài hay chạy thủ công server nào. CI=true buộc dựng server MỚI
  # thay vì tái dùng, tránh tranh cổng với môi trường khác.
  e2e:
    name: Giao diện (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cài phụ thuộc backend
        run: pip install -r backend/requirements.txt
      - name: Cài phụ thuộc frontend
        working-directory: frontend
        # `npm install` chứ không phải `npm ci`: repo chưa có package-lock.json
        # nên `npm ci` sẽ báo lỗi ngay. Khi nào commit package-lock.json thì
        # đổi lại sang `npm ci` để cài đúng phiên bản đã khoá.
        run: npm install --no-audit --no-fund
      - name: Tải chromium cho Playwright
        working-directory: frontend
        # Chỉ tải chromium, bỏ qua firefox/webkit và toàn bộ driver hệ thống
        # khác để job chạy nhanh và bớt rủi ro cài nhầm gói.
        run: npx playwright install --with-deps chromium
      - name: Chạy kiểm thử giao diện
        working-directory: frontend
        run: npx playwright test --reporter=line
      - name: Gửi báo cáo khi test hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Job 4: bắt lỗi cú pháp Dockerfile/compose ở mức `docker build` (không push).
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -f Dockerfile -t fth-api:ci .
      - name: Build image frontend
        run: docker build -f frontend/Dockerfile -t fth-web:ci ./frontend
      - name: Build image một-service (gộp API + React)
        # Image này là thứ thực sự deploy lên Render (render.yaml trỏ tới nó),
        # nên nó phải được build ở đây chứ không chỉ review.
        run: docker build -f Dockerfile.fullstack -t fth-ci .
      - name: Smoke test image một-service
        # Build xong chưa đủ: phải chứng minh nginx thực sự phục vụ SPA VÀ
        # chuyển tiếp được /api. Đây là đúng thứ đã hỏng 3 lần trên Render, nên
        # kiểm ở đây rẻ hơn nhiều so với phát hiện trên production.
        #
        # Mỗi bước đều in kết quả VÀ tự fail nếu sai — trước đây chỉ `curl -sf`
        # nên `/login` trả 404 vẫn coi là xong. Dùng `trap` để container luôn
        # được dọn dẹp kể cả khi bước nào fail, không để lại container treo.
        run: |
          set -u
          trap 'echo "--- log container:"; docker logs fth-smoke 2>&1 | tail -40 || true; docker rm -f fth-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name fth-smoke -e AUTO_SEED_ON_EMPTY=true -p 18001:8001 fth-ci
          ready=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:18001/api/v1/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "SAI: container không sẵn sàng sau 90 giây"; exit 1
          fi

          echo "--- 1. health qua chính nginx (chứng minh proxy hoạt động):"
          curl -sf http://127.0.0.1:18001/api/v1/health || { echo "SAI: health fail"; exit 1; }
          echo

          echo "--- 2. route SPA /login phải 200 (chứng minh try_files có hiệu lực):"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/login)
          echo "   $code"
          [ "$code" = "200" ] || { echo "SAI: /login trả $code, mong đợi 200"; exit 1; }

          echo "--- 3. security header (chứng minh đúng config của ta, không phải nginx mặc định):"
          curl -sI http://127.0.0.1:18001/ | grep -i x-frame-options || { echo "SAI: thiếu x-frame-options"; exit 1; }

          echo "--- 4. Content-Type của file JS phải là javascript (thiếu mime.types thì"
          echo "       mọi file thành text/plain, trang trắng dù mọi request đều 200):"
          js=$(curl -s http://127.0.0.1:18001/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$js" ] || { echo "SAI: không tìm thấy bundle JS trong index.html"; exit 1; }
          ct=$(curl -sI "http://127.0.0.1:18001$js" | grep -i '^content-type' | tr -d '\r')
          echo "   $js → $ct"
          echo "$ct" | grep -qiE 'javascript|ecmascript' || { echo "SAI: Content-Type sai"; exit 1; }

          echo "--- 5. đăng nhập demo (chứng minh API thật sự chạy, không chỉ nginx):"
          curl -sf -X POST http://127.0.0.1:18001/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"bgh@ftalenthub.edu.vn","password":"demo123"}' | head -c 80 \
            || { echo "SAI: đăng nhập thất bại"; exit 1; }
          echo
          echo "--- 6. endpoint cần token phải trả 401 (chứng minh không lộ dữ liệu):"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/api/v1/school/classes)
          echo "   $code"
          [ "$code" = "401" ] || { echo "SAI: /school/classes trả $code, mong đợi 401"; exit 1; }
          echo "TẤT CẢ 6 KIỂM TRA ĐỀU ĐẠT."
      - name: Kiểm tra cú pháp compose
        run: docker compose config --quiet
