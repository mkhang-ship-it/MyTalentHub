# Render Blueprint — FTalentHub, MỘT service duy nhất.
#
# VÌ SAO MỘT SERVICE
# ------------------
# Render có lúc tạo service web của ta thành Static Site dù đã chọn runtime
# Docker: nginx của Render không có `try_files` (mọi route SPA 404) và không
# proxy được `/api` — mà `src/api/client.ts` gọi cứng `/api/v1` trên chính
# origin và file đó không được sửa.
#
# Giải pháp: Dockerfile.fullstack gộp FastAPI và React vào cùng một container.
# Nginx nghe $PORT và chuyển tiếp /api sang 127.0.0.1:$API_PORT. Nhờ vậy:
#   - chỉ còn MỘT chỗ Render có thể cấu hình sai;
#   - không cần URL chéo giữa hai service, không cần CORS;
#   - tiêu thụ một nửa số giờ free-tier (750 giờ/tháng cho cả workspace);
#   - vẫn giữ đúng cơ chế X-Forwarded-For mà core/audit.py dùng để lấy IP.
#
# GIỚI HẠN CẦN BIẾT — nói thẳng, không giấu
# ---------------------------------------
# Đĩa của web service miễn phí là HỆ THỐNG FILE TẠM: mỗi lần ngủ hoặc redeploy là
# mất sạch, nên file SQLite bị xoá. AUTO_SEED_ON_EMPTY=true bên dưới sẽ seed lại
# mỗi lần khởi động. Hệ quả: DỮ LIỆU NGƯỜI DÙNG NHẬP SẼ MẤT khi service ngủ.
# Với bản demo thì điều này có lợi — mỗi khách vào thấy dữ liệu mẫu sạch — nhưng
# đừng để ai nhập dữ liệu thật vào bản miễn phí.
# Muốn giữ dữ liệu: persistent disk (0,25 USD/GB/tháng) hoặc PostgreSQL trả phí.

services:
  - type: web
    name: fth
    runtime: docker
    dockerfilePath: ./Dockerfile.fullstack
    dockerContext: .
    plan: free
    # Không đặt healthCheckPath: probe / sẽ 502 khi uvicorn chưa sẵn sàng, và
    # Dockerfile đã có HEALTHCHECK riêng đúng cổng $PORT.
    envVars:
      # Đĩa tạm nên phải tự seed mỗi lần khởi động.
      - key: AUTO_SEED_ON_EMPTY
        value: "true"
      - key: ALLOW_PUBLIC_REGISTER
        value: "true"
      - key: ALLOW_UNVERIFIED_EMAIL
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: PBKDF2_ITERATIONS
        value: "240000"
      # Link trong thư (quên mật khẩu, xác minh email) phải trỏ về domain thật.
      # Đặt sau khi deploy: https://fth-xxxx.onrender.com
      - key: FRONTEND_URL
        sync: false
      # Chưa có SMTP thì thư ghi vào outbox/ thay vì gửi đi — xem được link
      # trong Logs nhưng người dùng thật không nhận được thư.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MAIL_TO_OUTBOX
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_TTL_MINUTES
        sync: false
      - key: REFRESH_TOKEN_TTL_DAYS
        sync: false
      - key: RESET_TOKEN_TTL_MINUTES
        sync: false
      - key: AUDIT_RETENTION_DAYS
        sync: false
