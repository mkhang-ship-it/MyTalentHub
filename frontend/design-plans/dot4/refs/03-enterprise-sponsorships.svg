    <text x="104" y="614" font-size="13" font-weight="600" fill="#4b4a66" style="font-variant-numeric: tabular-nums">12.000.000 / 20.000.000 đ</text>
    <text x="472" y="614" font-size="13" font-weight="700" fill="#33324d" text-anchor="end" style="font-variant-numeric: tabular-nums">60%</text>
