# nginx.conf CHÍNH của image một-service.
#
# KHÁC với frontend/nginx.conf — file đó là server block, còn đây là cấu hình
# gốc mà nginx nạp lúc khởi động.
#
# VÌ SAO PHẢI TỰ VIẾT
# --------------------
# 1. Bỏ directive `user`.
#    Image nginx chính thức đặt `user nginx;` trong /etc/nginx/nginx.conf. Ta
#    chạy dưới uid 10001 (không phải root) nên nginx sẽ từ chối khởi động:
#      nginx: [emerg] the "user" directive makes sense only if the master
#             process runs with super-user privileges
#
# 2. Đưa pid và thư mục tạm sang nơi user thường ghi được.
#    Mặc định là /run/nginx.pid và /var/lib/nginx/* — đều thuộc root. Nginx
#    non-root không ghi được, và sẽ trả 500 ngay khi có request có body.
#
# 3. `include mime.types` là BẮT BUỘC, không có nó thì mọi file phục vụ ra đều
#    mang Content-Type `text/plain`. Trình duyệt sẽ từ chối chạy file JavaScript
#    module (CSP yêu cầu đúng kiểu MIME) → trang trắng, dù nginx trả 200.
#    Đây là loại lỗi rất dễ bỏ sót vì mọi request vẫn trả 200.

worker_processes auto;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Bảng MIME chuẩn của nginx. Thiếu dòng này thì .js/.css bị gán kiểu
    # text/plain và trình duyệt không nạp được (xem giải thích ở trên).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Thư mục tạm: mặc định Debian trỏ vào thư mục thuộc root.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Log ra stdout để Render hiển thị được trong tab Logs — không có nó thì
    # lỗi 502 trên production rất khó truy ra nguyên nhân.
    access_log /dev/stdout;

    # Server block của dự án (frontend/nginx.conf): `try_files` cho SPA và
    # proxy /api.
    include /etc/nginx/conf.d/*.conf;
}
