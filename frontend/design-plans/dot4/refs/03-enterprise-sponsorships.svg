  <text class="m12" x="80" y="1670" fill="#6F6C8A">Ghi chú ảnh: lưới dự án 1 cột &lt;640 · 2 cột 640–1279 · 3 cột ≥1280 · form 1 cột &lt;768 · BẢNG LỊCH SỬ → danh sách thẻ &lt;768 (00/4.7).</text>
  <text class="m12" x="80" y="1694" fill="#6F6C8A">Hộp thoại + toast vẽ để tham chiếu tỉ lệ (khối thoại và cảnh báo nằm trên trang ở z-index cao hơn — không phủ toàn trang trong thực tế).</text>
