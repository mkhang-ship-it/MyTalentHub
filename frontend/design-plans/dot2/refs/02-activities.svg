<!-- ===== GHI CHÚ ===== -->
<text x="312" y="1394" font-size="11" font-weight="700" fill="#C44296">GHI CHÚ BẮT BUỘC (P2 KHÔNG ĐƯỢC PHÁ)</text>
<text x="312" y="1414" font-size="12" font-weight="500" fill="#6F6C8A">• 6 bất biến giữ nút thẳng hàng: grid items-stretch · article flex h-full flex-col · banner shrink-0 (84px) · thân flex-1 · title min-h 48 + line-clamp-2 · khối nút mt-auto shrink-0 + chung 1 class.</text>
<text x="312" y="1434" font-size="12" font-weight="500" fill="#6F6C8A">• Kiểm thử: 3 thẻ title 1 dòng / 2 dòng / mô tả dài → đáy 3 nút phải trùng nhau tuyệt đối ở 390/768/1440.</text>
<text x="312" y="1454" font-size="12" font-weight="500" fill="#6F6C8A">• Lưới: grid-cols-1 md:grid-cols-2 lg:grid-cols-3 · gap-4 md:gap-6 (16/24) · items-stretch.</text>
<text x="312" y="1474" font-size="12" font-weight="500" fill="#6F6C8A">• Thẻ: radius 20 (rounded-[20px], KHÔNG rounded-2xl) · bỏ hover-lift (thẻ không phải vùng bấm) · progress h8 track --line + aria-hidden.</text>
<text x="312" y="1494" font-size="12" font-weight="500" fill="#6F6C8A">• Meta 12/400 --muted-strong · “Còn N chỗ” #047857 · “Hết chỗ” #B91C1C · banner CTA cuối: nền --brand-soft, bỏ interactive.</text>
<text x="312" y="1514" font-size="12" font-weight="500" fill="#6F6C8A">• Giữ nguyên: API load/register, registeringId, khungDauTrang, ACTIVITY_FIELD_NAMES, data-testid, mọi text tiếng Việt hiện có.</text>
<text x="312" y="1540" font-size="11" font-weight="700" fill="#C44296">ẢNH CHỈ ĐỂ XEM HÌNH DẠNG — mọi con số/màu chuẩn nằm ở 02-activities.md.</text>
</svg>
