# FTalentHub Web — cấu hình nginx: phục vụ SPA + proxy /api về backend.
# Frontend gọi API bằng đường dẫn tương đối /api/v1/... nên trình duyệt KHÔNG cần
# biết backend ở đâu; nginx chuyển tiếp sang service `api` trong compose.
upstream fth_api {
    server api:8001;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bật gzip cho tài nguyên tĩnh.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: giữ nguyên path (/api/v1/...), thêm header chuyển tiếp.
    location /api/ {
        proxy_pass http://fth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA fallback: route /student, /coach... đều trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
