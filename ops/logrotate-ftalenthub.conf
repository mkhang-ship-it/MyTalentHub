# FTalentHub — xoay file log của ứng dụng.
# Cài đặt: copy file này thành /etc/logrotate.d/ftalenthub trên máy production
# (cần quyền root, KHÔNG nằm trong repo chạy dev).
#
# Áp dụng khi log được chuyển hướng ra file /var/log/ftalenthub/*.log.
# Mặc định: scripts/dev.sh ghi log ra /tmp/ftalenthub-dev-{api,web}.log,
# Docker ghi ra stdout (thu bằng `docker logs` hoặc log driver json-file /
# journald rồi đẩy lên Loki/CloudWatch). File này dùng cho trường hợp ops
# chọn gom log ra file (ví dụ uvicorn --log-config chuyển access log ra file,
# hoặc redirect stdout của service vào /var/log/ftalenthub/).
#
# Định dạng từng dòng log để kỹ sư vận hành parse (xem thêm
# docs/PRODUCTION-CHECKLIST.md mục 4):
#   1. Access log của uvicorn:
#        INFO:     127.0.0.1:56789 - "GET /api/v1/health HTTP/1.1" 200
#   2. Vòng đời server uvicorn:
#        INFO:     Started server process [123] / Uvicorn running on ... / Shutting down
#   3. Logger "ftalenthub" của ứng dụng (backend/app/core/logging_conf.py,
#      mức từ env LOG_LEVEL, mặc định INFO):
#        2026-09-27 17:14:14 INFO ftalenthub [rid=a1b2c3d4] ...
#      Trong đó middleware (backend/app/core/errors.py) ghi mỗi request:
#        GET /api/v1/student/profile -> 200 12.3ms request_id=a1b2c3d4
#      (5xx ghi ở mức ERROR; ngoài request thì rid=-; response kèm header
#      X-Request-ID trùng mã để đối chiếu client ↔ server).
/var/log/ftalenthub/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    # uvicorn giữ file descriptor mở suốt thời gian chạy nên phải copytruncate
    # (copy rồi cắt file gốc) thay vì create/restart service.
    copytruncate
    dateext
    dateformat -%Y%m%d
}
