  <rect width="1440" height="1740" fill="#fdf7f1"/>

  <!-- PageHeader (không còn “(slide 31)”) -->
  <text class="t1" x="80" y="64">Tài trợ dự án học sinh</text>
  <text class="t2" x="80" y="92">Đầu tư vào các dự án sáng tạo của học sinh sinh viên.</text>

  <!-- ═══ BANNER TỔNG: scrim + radius 20 + icon chip nền trắng ═══ -->
  <g>
    <rect x="80" y="140" width="1280" height="104" rx="20" fill="url(#hero)"/>
    <rect x="80" y="140" width="1280" height="104" rx="20" fill="url(#scrim)"/>
    <rect x="104" y="168" width="48" height="48" rx="12" fill="#ffffff"/>
    <path d="M128 180 v24 M120 188 h16" stroke="#922C6B" stroke-width="3" stroke-linecap="round"/>
    <text x="176" y="186" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.06em">TỔNG ĐÃ TÀI TRỢ</text>
    <text x="176" y="216" font-size="24" font-weight="800" fill="#ffffff" style="font-variant-numeric: tabular-nums">125.000.000 đ</text>
    <text x="700" y="216" font-size="12" fill="#ffffff">Chỉ tính tài trợ đã duyệt · trên 42 dự án</text>
  </g>

  <!-- ═══ HÀNG BỘ LỌC (gap 16) ═══ -->
  <g>
