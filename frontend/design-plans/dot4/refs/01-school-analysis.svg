      <text class="val12" x="0" y="-76" text-anchor="middle">78</text>
      <text class="axis12" x="86" y="-52" text-anchor="start">Nghệ thuật</text>
      <text class="val12" x="86" y="-36" text-anchor="start">71</text>
      <text class="axis12" x="86" y="46" text-anchor="start">Thể thao</text>
      <text class="val12" x="86" y="62" text-anchor="start">64</text>
