    <path d="M98 292 h14 M101 297 h8 M104 302 h2" stroke="#6F6C8A" stroke-width="1.5" stroke-linecap="round"/>
    <text class="b14" x="124" y="304">Tất cả lĩnh vực</text>
    <rect class="ctl" x="376" y="276" width="280" height="44" rx="12"/>
    <text class="b14" x="392" y="304">Tất cả trạng thái</text>
