# CI cho FTalentHub — chạy trên mọi push vào main và mọi pull request.
# Không push image lên registry, không dùng secret nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: kiểm thử backend (unittest thư viện chuẩn, không cần pytest).
  backend:
    name: Backend (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài phụ thuộc backend
        run: pip install -r backend/requirements.txt
      - name: Chạy unittest
        # Chạy từ GỐC repo để đường dẫn gói `backend.*` đúng như tài liệu scripts/README.md.
        run: python -m unittest discover -s backend/tests -t backend -v

  # Job 1b: CHẠY LẠI TOÀN BỘ TEST TRÊN POSTGRESQL THẬT.
  # Lý do tồn tại: `DATABASE_URL` hỗ trợ PostgreSQL là điều ta TIN nhưng chưa
  # từng chạy thật — máy dev không có PostgreSQL và không có Docker. Ở đây
  # dùng service container của GitHub Actions nên lần chạy này là lần đầu
  # thật sự chứng minh code chạy được ngoài SQLite.
  # Nó bắt được cả những lỗi chỉ xuất hiện ở PostgreSQL: kiểu dữ liệu, câu
  # SQL dùng cú pháp riêng của SQLite, `ALTER TABLE ... ADD COLUMN` không có
  # IF NOT EXISTS, và việc transaction không rollback đúng.
  postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Chỉ dùng trong CI tạm, không phải bí mật thật.
          POSTGRES_USER: fth
          POSTGRES_PASSWORD: fth
          POSTGRES_DB: fth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://fth:fth@127.0.0.1:5432/fth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài phụ thuộc backend
        run: pip install -r backend/requirements.txt
      - name: Tạo lược đồ trên PostgreSQL
        # Database CI này rỗng hoàn toàn, không seed. Nhiệm vụ của job chỉ là
        # chứng minh DDL và truy vấn chạy được trên PostgreSQL, không phải
        # kiểm tra dữ liệu nghiệp vụ — việc đó job `backend` đã lo với SQLite.
        run: |
          cd backend
          python -c "
          from app.database import Base, engine
          import app.models  # noqa: F401  - để model được đăng ký vào Base
          from app.security import (
              create_refresh_token_table, create_verification_token_table,
          )
          Base.metadata.create_all(bind=engine)
          create_refresh_token_table()
          create_verification_token_table()
          print('DDL OK trên', engine.dialect.name)
          "
      - name: Chạy unittest trên PostgreSQL
        run: python -m unittest discover -s backend/tests -t backend -v

  # Job 2: kiểm tra chất lượng frontend (đúng 3 lệnh trong scripts/README.md).
  frontend:
    name: Frontend (tsc/eslint/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cài phụ thuộc frontend
        working-directory: frontend
        # Repo chưa có package-lock.json nên chưa dùng được `npm ci`
        # (khi nào có lockfile thì đổi lại `npm ci` để build lặp lại được).
        run: npm install --no-audit --no-fund
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: frontend
        run: npx eslint src --max-warnings 0
      - name: Build
        working-directory: frontend
        run: npx vite build

  # Job 3: kiểm thử giao diện thật bằng Playwright (chromium headless).
  # playwright.config.ts tự dựng backend + frontend rồi tự tắt, nên job này
  # không cần cài hay chạy thủ công server nào. CI=true buộc dựng server MỚI
  # thay vì tái dùng, tránh tranh cổng với môi trường khác.
  e2e:
    name: Giao diện (Playwright)
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cài phụ thuộc backend
        run: pip install -r backend/requirements.txt
      - name: Cài phụ thuộc frontend
        working-directory: frontend
        # `npm install` chứ không phải `npm ci`: repo chưa có package-lock.json
        # nên `npm ci` sẽ báo lỗi ngay. Khi nào commit package-lock.json thì
        # đổi lại sang `npm ci` để cài đúng phiên bản đã khoá.
        run: npm install --no-audit --no-fund
      - name: Tải chromium cho Playwright
        working-directory: frontend
        # Chỉ tải chromium, bỏ qua firefox/webkit và toàn bộ driver hệ thống
        # khác để job chạy nhanh và bớt rủi ro cài nhầm gói.
        run: npx playwright install --with-deps chromium
      - name: Chạy kiểm thử giao diện
        working-directory: frontend
        run: npx playwright test --reporter=line
      - name: Gửi báo cáo khi test hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Job 4: bắt lỗi cú pháp Dockerfile/compose ở mức `docker build` (không push).
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -f Dockerfile -t fth-api:ci .
      - name: Build image frontend
        run: docker build -f frontend/Dockerfile -t fth-web:ci ./frontend
      - name: Kiểm tra cú pháp compose
        run: docker compose config --quiet
