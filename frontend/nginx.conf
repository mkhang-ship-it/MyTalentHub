# FTalentHub Web — cấu hình nginx: phục vụ SPA + proxy /api về backend.
# Đây là BẢN DEV (không TLS): dùng cho `npm run dev` qua vite lẫn image Docker
# mặc định (frontend/Dockerfile chỉ copy file này). Máy dev không có chứng thư
# nên bản này phải chạy được trên HTTP trần.
# BẢN PRODUCTION có TLS nằm riêng ở frontend/nginx.tls.conf (redirect 80→443,
# chứng thư, HSTS) — tách 2 file để dev không bao giờ đòi cert, còn production
# không bao giờ vô tình chạy HTTP trần. Khi deploy TLS ở chính nginx, mount
# nginx.tls.conf đè lên /etc/nginx/conf.d/default.conf (xem docs/DEPLOY.md).
# Frontend gọi API bằng đường dẫn tương đối /api/v1/... nên trình duyệt KHÔNG cần
# biết backend ở đâu; nginx chuyển tiếp sang service `api` trong compose.
#
# LƯU Ý rate limit: giới hạn tốc độ ở đây chỉ là LỚP THỨ HAI, sau lớp chặn ngay
# trong ứng dụng (backend/app/security.py: tối đa 5 lần đăng nhập sai / email /
# 10 phút + token có hạn TOKEN_TTL_DAYS). Lớp nginx chặn sớm request ồ ạt từ một
# IP trước khi chạm tới Python. KHÔNG áp limit_req lên location /api/ chung vì
# sẽ chặn nhầm lưu lượng hợp lệ lúc giờ cao điểm (học sinh check-in đồng loạt).
upstream fth_api {
    server api:8001;
}

# Vùng đếm cho riêng endpoint đăng nhập: 10MB (~160k IP), 5 request/phút/IP,
# cho bùng nổ (burst) thêm 5 request chờ — vượt quá trả 429, không 503.
limit_req_zone $binary_remote_addr zone=fth_login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Giới hạn kích thước body: có endpoint import CSV (/school/import/students)
    # nên để 5m thay vì mặc định 1m của nginx (file CSV lớp học hiếm khi hơn).
    client_max_body_size 5m;

    # Security header an toàn cả trên HTTP (dev). HSTS CỐ Ý không có ở đây vì
    # chỉ có ý nghĩa trên HTTPS — bật HSTS ở bản HTTP sẽ vô tác dụng, còn bật
    # nhầm ở localhost sẽ khiến trình duyệt nhớ và gây rắc rối khi đổi cổng.
    # HSTS nằm ở nginx.tls.conf (bản production).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Bật gzip cho tài nguyên tĩnh.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Đăng nhập: giới hạn riêng 5 req/phút/IP + burst 5 (vượt → 429).
    # Dùng `location =` khớp chính xác để các path khác (/api/v1/auth/me,
    # /api/v1/auth/register...) KHÔNG bị dính limit này.
    location = /api/v1/auth/login {
        limit_req zone=fth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # API: giữ nguyên path (/api/v1/...), thêm header chuyển tiếp.
    # KHÔNG gắn limit_req ở đây — xem ghi chú rate limit ở đầu file.
    location /api/ {
        proxy_pass http://fth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA fallback: route /student, /coach... đều trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
