<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1460" viewBox="0 0 1440 1460" font-family="'Be Vietnam Pro', Inter, sans-serif">
  <title>Tham khảo 01 — Trang Phân tích năng lực (Đợt 4)</title>
  <desc>Ảnh tham khảo. CHỮ THẮNG ẢNH — con số chuẩn ở 01-school-analysis.md. Radar dùng chuỗi S1 #1B2A5E; badge hạng theo 00/4.3; không còn tô màu theo hạng.</desc>

  <defs>
    <style>
      .t1 { font-size: 24px; font-weight: 800; fill: #33324d; }
      .t2 { font-size: 14px; fill: #6F6C8A; }
      .h3 { font-size: 18px; font-weight: 700; fill: #33324d; }
      .lbl { font-size: 13px; font-weight: 600; fill: #4b4a66; }
      .b14 { font-size: 14px; fill: #4b4a66; }
      .b14b { font-size: 14px; font-weight: 600; fill: #33324d; }
      .n14 { font-size: 14px; font-weight: 700; fill: #33324d; }
      .m12 { font-size: 12px; fill: #6F6C8A; }
      .th { font-size: 12px; font-weight: 700; fill: #6F6C8A; letter-spacing: 0.06em; }
      .val12 { font-size: 12px; font-weight: 700; fill: #33324d; }
      .axis12 { font-size: 12px; font-weight: 600; fill: #4b4a66; }
      .link { font-size: 14px; font-weight: 600; fill: #6E4390; }
      .card { fill: #ffffff; stroke: #ede7e1; stroke-width: 1; }
      .rowline { stroke: #ede7e1; stroke-width: 1; }
      .thead { stroke: #e2d9d0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="1460" fill="#fdf7f1"/>

  <!-- PageHeader (không còn “(slide 25)”) -->
  <text class="t1" x="80" y="64">Phân tích năng lực học sinh</text>
  <text class="t2" x="80" y="92">So sánh năng khiếu theo khối, lớp và các nhóm ngành.</text>

  <!-- ═══ HÀNG 1: RADAR + XẾP HẠNG KHỐI (2 cột ≥1024) ═══ -->
  <g>
    <!-- Card radar -->
    <rect class="card" x="80" y="140" width="628" height="440" rx="20"/>
    <text class="h3" x="104" y="176">Bản đồ năng khiếu toàn trường</text>

