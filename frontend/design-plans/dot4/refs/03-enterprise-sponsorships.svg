<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" font-family="'Be Vietnam Pro', Inter, sans-serif">
  <title>Tham khảo 03 — Trang Tài trợ (Đợt 4)</title>
  <desc>Ảnh tham khảo. CHỮ THẮNG ẢNH — con số chuẩn ở 03-enterprise-sponsorships.md. Banner có scrim navy, chip lĩnh vực thay “Tiềm năng”, form span cột mới (submit hàng riêng canh phải), badge trạng thái theo tone 00/4.3.</desc>

  <defs>
    <style>
      .t1 { font-size: 24px; font-weight: 800; fill: #33324d; }
      .t2 { font-size: 14px; fill: #6F6C8A; }
      .h3 { font-size: 18px; font-weight: 700; fill: #33324d; }
      .h3m { font-size: 17px; font-weight: 700; fill: #33324d; }
      .lbl { font-size: 13px; font-weight: 600; fill: #4b4a66; }
      .b14 { font-size: 14px; fill: #4b4a66; }
      .b14b { font-size: 14px; font-weight: 600; fill: #33324d; }
      .n14 { font-size: 14px; font-weight: 700; fill: #33324d; }
      .m12 { font-size: 12px; fill: #6F6C8A; }
      .th { font-size: 12px; font-weight: 700; fill: #6F6C8A; letter-spacing: 0.06em; }
      .card { fill: #ffffff; stroke: #ede7e1; stroke-width: 1; }
      .rowline { stroke: #ede7e1; stroke-width: 1; }
      .thead { stroke: #e2d9d0; stroke-width: 1; }
      .ctl { fill: #ffffff; stroke: #968D82; stroke-width: 1; }
      .btnP { fill: #C44296; }
      .btnS { fill: #ffffff; stroke: #968D82; stroke-width: 1; }
    </style>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A4E"/><stop offset="0.48" stop-color="#EE3380"/><stop offset="1" stop-color="#8842C8"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2A5E" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#1B2A5E" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#1B2A5E" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
