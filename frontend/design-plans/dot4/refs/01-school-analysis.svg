    <g transform="translate(394,368)">
      <polygon points="0,-77 66.7,-38.5 66.7,38.5 0,77 -66.7,38.5 -66.7,-38.5" fill="none" stroke="#ede7e1" stroke-width="1" stroke-dasharray="4 3"/>
      <polygon points="0,-57.8 50,-28.9 50,28.9 0,57.8 -50,28.9 -50,-28.9" fill="none" stroke="#ede7e1" stroke-width="1" stroke-dasharray="4 3"/>
      <polygon points="0,-38.5 33.3,-19.2 33.3,19.2 0,38.5 -33.3,19.2 -33.3,-19.2" fill="none" stroke="#ede7e1" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="0" y1="0" x2="0" y2="-77" stroke="#cfc6bc" stroke-width="1"/>
      <line x1="0" y1="0" x2="66.7" y2="-38.5" stroke="#cfc6bc" stroke-width="1"/>
      <line x1="0" y1="0" x2="66.7" y2="38.5" stroke="#cfc6bc" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="77" stroke="#cfc6bc" stroke-width="1"/>
