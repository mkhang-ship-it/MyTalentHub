# FTalentHub — chạy cả hệ thống bằng một lệnh.
# Giả định duy nhất: máy đã cài Docker (không có Docker thì làm theo README.md để chạy tay).
#
# ── CÁCH CHÍNH ĐÃ DÙNG ĐỂ DEPLOY ────────────────────────────────────────
#   docker compose up --build -d
#   docker compose exec app python -m app.seed   # nạp dữ liệu demo lần đầu
#   docker compose logs -f
#   docker compose down
#
# Mặc định dựng MỘT service `app` từ `Dockerfile.fullstack` — đúng image thực sự
# deploy lên Render (một container chứa cả FastAPI lẫn React, nginx nghe $PORT
# và chuyển tiếp /api sang 127.0.0.1:$API_PORT). Dùng profile `tach` nếu cần tách
# hai service để phát triển (xem cuối file).
#
# ── VÌ SAO MẶC ĐỊNH LÀ MỘT SERVICE ──────────────────────────────────────
# Trước đây compose này (và Render) dựng 2 service: `api` + `web`, web nginx
# proxy sang api. Cách đó KHÔNG dùng được trên Render: Render tạo service web
# thành **Static Site** dù đã chọn runtime Docker. Bằng chứng đã thu thập:
# bundle JS khớp chính xác bản build local (Render build đúng code của ta), nhưng
# KHÔNG có security header, `/login` trả 404, và 6 lần POST /api/v1/auth/login
# đều 404 chứ không có 429 — tức đang phục vụ bằng nginx của Render chứ không
# phải nginx.conf của ta. Một container duy nhất làm biến mất toàn bộ vấn đề đó.
#
# ── CỔNG ──────────────────────────────────────────────────────────────────
#   app  : 8001 → http://localhost:8001   (nginx nghe ở container, cổng này là
#                                          cổng expose ra ngoài)
#   Nếu đã chạy backend bằng tay ở 8001 thì đổi sang 8080:8080.
#   Profile `tach`: api 8001, web 5173.
#
# ── DỮ LIỆU ───────────────────────────────────────────────────────────────
# File SQLite nằm ở /app/data. Volume `sqlite-data` mount vào đúng thư mục đó
# nên dữ liệu sống sót qua restart. Khi rebuild mà volume cũ vẫn còn, hãy
# recreate: `docker compose up --build --force-recreate`.
# `docker compose down -v` XOÁ volume — mất dữ liệu, cân nhắc kỹ.

name: ftalenthub

services:
  # ── Mặc định: một service, đúng image deploy lên Render ────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    env_file:
      - path: .env
        required: false
    environment:
      # DB trống thì tự seed — thuận cho demo. BỎ dòng này ở production nếu
      # muốn CSDL trống thật (mọi biến thuộc tính này đều nên đặt tay).
      AUTO_SEED_ON_EMPTY: ${AUTO_SEED_ON_EMPTY:-true}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-true}
      ALLOW_UNVERIFIED_EMAIL: ${ALLOW_UNVERIFIED_EMAIL:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PBKDF2_ITERATIONS: ${PBKDF2_ITERATIONS:-240000}
      # Cổng nginx nghe TRONG container; uvicorn chỉ nghe 127.0.0.1:$API_PORT.
      # Hai cổng này PHẢI khác nhau — trùng thì nginx chết với
      # "bind() failed (98: Address already in use)".
      PORT: ${PORT:-8001}
      API_PORT: ${API_PORT:-8002}
      # Đường dẫn gốc cho link trong thư (quên mật khẩu, xác minh email) và cho
      # mã QR quét ra. Mặc định là origin mà trình duyệt đang dùng.
      FRONTEND_URL: ${FRONTEND_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - sqlite-data:/app/data
    networks:
      - fth-net
    restart: unless-stopped
    healthcheck:
      # Theo đúng cổng nginx đang nghe ($PORT), không phải cổng uvicorn.
      test: ["CMD-SHELL", "python -c \"import os,sys,urllib.request; p=os.environ.get('PORT','8001'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/api/v1/health', timeout=4).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cho đủ thời gian build schema + seed lần đầu trước khi coi là hỏng.
      start_period: 90s

  # ── Tách hai service để phát triển: --profile tach ──────────────────────
  # Dùng khi cần `npm run dev` (vite HMR) nhưng backend chạy trong container.
  # KHÔNG dùng để deploy: chính hình thức này đã hỏng trên Render.
  api:
    profiles: ["tach"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AUTO_SEED_ON_EMPTY: ${AUTO_SEED_ON_EMPTY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    volumes:
      - sqlite-data:/app
    networks:
      - fth-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    profiles: ["tach"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      FTH_API_UPSTREAM: api:8001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fth-net
    restart: unless-stopped

volumes:
  sqlite-data:
    name: ftalenthub-sqlite

networks:
  fth-net:
    name: ftalenthub-net
