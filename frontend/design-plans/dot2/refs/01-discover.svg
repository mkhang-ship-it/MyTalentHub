<text x="312" y="2034" font-size="11" font-weight="700" fill="#C44296">GHI CHÚ BẮT BUỘC</text>
<text x="312" y="2054" font-size="12" font-weight="500" fill="#6F6C8A">• Card kết quả nằm SAU nút điều hướng (margin-top 24) · nền = hero-gradient + scrim navy · mọi chữ trắng opacity 1 (không white/75, white/85, bg-white/20).</text>
<text x="312" y="2072" font-size="12" font-weight="500" fill="#6F6C8A">• Ô cực: nền rgba(27,42,94,.5) + viền trắng 22%; giá trị luôn có ở dạng chữ (14/700) → thanh chỉ là phần phụ.</text>
<text x="312" y="2090" font-size="12" font-weight="500" fill="#6F6C8A">• Lỗi tải câu hỏi: GIỮ PageHeader + ErrorBox + nút “Thử lại” (không return ErrorBox thay cả trang) · questions = [] → Empty + nút quay lại.</text>
<text x="312" y="2108" font-size="12" font-weight="500" fill="#6F6C8A">• Mọi text 12–15px dùng --muted-strong #6F6C8A (5,01:1), KHÔNG dùng --muted.</text>
