# nginx.conf CHÍNH (khác với frontend/nginx.conf là cấu hình server block).
#
# VÌ SAO PHẢI CÓ FILE NÀY
# -----------------------
# Cấu hình nginx mặc định của gói Debian bắt đầu bằng `user www-data;` và
# ghi pid vào /run/nginx.pid. Image của dự án chạy dưới user KHÔNG phải root
# (uid 10001), nên nginx sẽ từ chối khởi động:
#   nginx: [emerg] the "user" directive makes sense only if the master process
#          runs with super-user privileges
# Việc này chỉ lộ ra khi chạy thật container — smoke test trong CI bắt được.
#
# Cấu hình này bỏ directive `user`, đặt pid trong /tmp (ghi được bởi user
# thường), và chỉ include server block của ta.

worker_processes auto;

# Đường dẫn phải nằm ở nơi user thường ghi được.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Thư mục tạm: mặc định Debian trỏ vào thư mục thuộc root, nginx non-root
    # không ghi được và sẽ báo 500 khi nhận request có body.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Server block của dự án (frontend/nginx.conf) — đã có `try_files` cho SPA
    # và proxy /api.
    include /etc/nginx/conf.d/*.conf;
}
